<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8b2e2e">
<title>עַל · Карточки иврита</title>
<link href="https://fonts.googleapis.com/css2?family=David+Libre:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf6ef; --ink:#241f1c; --brick:#8b2e2e;
  --mut:#8a7f76; --line:#d9cfc2; --green:#2f7d4f; --red:#b3372e;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font:16px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column; align-items:center;
  min-height:100dvh; padding:14px 14px 20px;
}
.he{font-family:"David Libre",Georgia,serif; direction:rtl}
.wrap{width:100%; max-width:560px; display:flex; flex-direction:column; gap:12px; flex:1}

header{display:flex; align-items:baseline; justify-content:space-between; border-bottom:2px solid var(--brick); padding-bottom:8px}
header h1{margin:0; font-size:20px; font-weight:700}
header h1 .he{color:var(--brick); font-size:26px}
header .count{color:var(--mut); font-size:13px}

.controls{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.seg{display:flex; border:1.5px solid var(--brick); border-radius:8px; overflow:hidden}
.seg button{border:0; background:transparent; color:var(--brick); padding:8px 12px; font-size:14px; font-weight:600; cursor:pointer}
.seg button.on{background:var(--brick); color:#fff}
.seg.small button{padding:6px 10px; font-size:13px}
#nikudTgl{
  margin-left:auto; display:flex; align-items:center; gap:7px; font-size:14px;
  color:var(--ink); cursor:pointer; user-select:none; border:0; background:none; padding:6px 2px;
}
#nikudTgl .sw{width:38px; height:22px; border-radius:11px; background:var(--line); position:relative; transition:background .15s}
#nikudTgl .sw::after{content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:left .15s; box-shadow:0 1px 2px rgba(0,0,0,.25)}
#nikudTgl.on .sw{background:var(--green)}
#nikudTgl.on .sw::after{left:18px}

.chips{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.chips button{border:1px solid var(--line); background:#fff; color:var(--mut); border-radius:14px; padding:5px 11px; font-size:12.5px; cursor:pointer}
.chips button.on{border-color:var(--brick); color:var(--brick); background:#f6e9e6; font-weight:600}
.chips .all{border:0; background:none; text-decoration:underline; padding:5px 4px}

.progressLine{font-size:13px; color:var(--mut); display:flex; justify-content:space-between; align-items:center; gap:8px}
.progressLine b{color:var(--green)}
#resetBtn{border:0; background:none; color:var(--mut); text-decoration:underline; font-size:12.5px; cursor:pointer; padding:4px; white-space:nowrap}
#resetBtn.arm{color:var(--red); font-weight:700; text-decoration:none}

.stage{flex:1; display:flex; flex-direction:column; justify-content:center; gap:16px; min-height:330px}
.plate{position:relative}
.plate::before{content:""; position:absolute; inset:10px -8px -10px 8px; background:var(--brick); border-radius:4px; pointer-events:none}
#card{
  position:relative; width:100%; min-height:290px; cursor:pointer;
  background:#fffdf9; border:1.5px solid var(--brick); border-radius:4px;
  box-shadow:inset 0 0 0 4px #fffdf9, inset 0 0 0 5.5px rgba(139,46,46,.45);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; padding:34px 20px; text-align:center; font:inherit; color:inherit;
}
.sec{position:absolute; top:12px; left:0; right:0; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--mut)}
.lrn{position:absolute; top:12px; right:14px; font-size:12px; color:var(--green)}
.big-he{font-family:"David Libre",Georgia,serif; direction:rtl; font-size:50px; line-height:1.3; font-weight:700}
.big-he.mid{font-size:40px}
.big-ru{font-size:26px; font-weight:600; line-height:1.3}
.tr{font-size:20px; font-style:italic; color:var(--brick)}
.ru2{font-size:20px}
.hint{position:absolute; bottom:12px; left:0; right:0; font-size:12px; color:var(--mut)}

.answers{display:flex; gap:10px; visibility:hidden}
.answers.show{visibility:visible}
.answers button{flex:1; border:0; border-radius:8px; padding:16px 10px; font-size:16.5px; font-weight:700; color:#fff; cursor:pointer}
.answers .no{background:var(--red)}
.answers .yes{background:var(--green)}
.answers button:active{filter:brightness(.9)}

.stats{display:flex; justify-content:center; gap:18px; font-size:13.5px; color:var(--mut)}
.stats b{color:var(--ink)}

.done{display:none; flex-direction:column; align-items:center; gap:14px; text-align:center}
.done.show{display:flex}
.done .he{font-size:44px; color:var(--brick); font-weight:700}
.done p{margin:0; font-size:17px}
.done button{border:1.5px solid var(--brick); background:var(--brick); color:#fff; border-radius:8px; padding:12px 26px; font-size:16px; font-weight:700; cursor:pointer}
button:focus-visible{outline:3px solid var(--green); outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="he">עַל</span> · карточки иврита</h1>
    <span class="count" id="totalCount"></span>
  </header>

  <div class="controls">
    <div class="seg" id="dirSeg">
      <button type="button" data-d="he" class="on">עב → ру</button>
      <button type="button" data-d="ru">ру → עב</button>
      <button type="button" data-d="mix">микс</button>
    </div>
    <button type="button" id="nikudTgl" class="on" role="switch" aria-checked="true"><span class="sw"></span>огласовки</button>
  </div>

  <div class="controls">
    <div class="seg small" id="poolSeg">
      <button type="button" data-p="all" class="on">все слова</button>
      <button type="button" data-p="new">только невыученные</button>
    </div>
  </div>

  <div class="chips" id="chips"></div>

  <div class="progressLine">
    <span id="learnedLine"></span>
    <button type="button" id="resetBtn">сбросить прогресс</button>
  </div>

  <div class="stage">
    <div class="plate" id="plate">
      <button type="button" id="card" aria-label="Карточка — нажми, чтобы перевернуть"></button>
    </div>
    <div class="answers" id="answers">
      <button type="button" class="no" id="btnNo">✗ Повторить</button>
      <button type="button" class="yes" id="btnYes">✓ Знаю</button>
    </div>
    <div class="done" id="doneBox"></div>
    <div class="stats">
      <span>осталось <b id="stLeft">0</b></span>
      <span>знаю <b id="stKnown">0</b></span>
      <span>повторы <b id="stRep">0</b></span>
    </div>
  </div>
</div>

<script src="words.js"></script>
<script>
"use strict";
var DB = window.WORDS_DB || {sections:[], words:[]};
var SECTIONS = DB.sections, W = DB.words;

var KEY="ivrit-cards-v2";
function stripNikud(s){ return s.replace(/[\u0591-\u05BD\u05BF\u05C1\u05C2\u05C4\u05C5\u05C7]/g,""); }
function $(id){ return document.getElementById(id); }

/* ---------- хранилище: localStorage (сайт) -> window.storage (Claude) ---------- */
var backend = "";
async function detectBackend(){
  try{
    localStorage.setItem(KEY+"-probe","1");
    localStorage.removeItem(KEY+"-probe");
    backend="браузер"; return;
  }catch(e){}
  try{
    if(window.storage){
      var r = await window.storage.set(KEY+"-probe","1",false);
      if(r){ backend="Claude"; return; }
    }
  }catch(e){}
  backend="";
}
async function loadState(){
  if(backend==="браузер"){
    try{ var s=localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){}
    return null;
  }
  if(backend==="Claude"){
    try{
      var r = await window.storage.get(KEY, false);
      if(r && r.value) return JSON.parse(r.value);
    }catch(e){}
  }
  return null;
}
function saveState(){
  var st = { dir:dir, nikud:nikud, pool:pool, activeNames:activeNames, prog:prog };
  var s = JSON.stringify(st);
  if(backend==="браузер"){
    try{ localStorage.setItem(KEY, s); }catch(e){}
  } else if(backend==="Claude"){
    try{ window.storage.set(KEY, s, false).catch(function(){}); }catch(e){}
  }
}

/* ---------- состояние ---------- */
var dir="he", nikud=true, pool="all";
var activeNames={}; SECTIONS.forEach(function(n){ activeNames[n]=true; });
var prog={};   // ключ: слово-без-огласовок + направление -> серия «знаю» подряд; >=2 = выучено
var queue=[], known=0, reps=0, deckSize=0, flipped=false, firstCard=true;

var card=$("card"), answers=$("answers"), plate=$("plate"), doneBox=$("doneBox");

function secName(i){ return SECTIONS[W[i].s] || ""; }
function isActive(i){ return activeNames[secName(i)] !== false; }
function pk(i,d){ return stripNikud(W[i].h)+"_"+d; }
function isLearned(i,d){ return (prog[pk(i,d)]||0) >= 2; }
function learnedCount(d){
  var n=0; for(var i=0;i<W.length;i++) if(isLearned(i,d)) n++;
  return n;
}
function activeCount(){ var n=0; SECTIONS.forEach(function(nm){ if(activeNames[nm]!==false) n++; }); return n; }

/* ---------- UI ---------- */
function buildChips(){
  var box=$("chips"); box.innerHTML="";
  SECTIONS.forEach(function(name){
    var b=document.createElement("button");
    b.type="button"; b.textContent=name;
    if(activeNames[name]!==false) b.className="on";
    b.addEventListener("click",function(){
      activeNames[name] = activeNames[name]===false ? true : false;
      if(!activeCount()) activeNames[name]=true;
      saveState(); buildDeck();
    });
    box.appendChild(b);
  });
  var all=document.createElement("button");
  all.type="button"; all.textContent="все"; all.className="all";
  all.addEventListener("click",function(){
    SECTIONS.forEach(function(n){ activeNames[n]=true; });
    saveState(); buildDeck();
  });
  box.appendChild(all);
}

function updLearnedLine(){
  $("learnedLine").innerHTML =
    'выучено: עב→ру <b>'+learnedCount("he")+'</b> · ру→עב <b>'+learnedCount("ru")+'</b> из '+W.length;
}

function cardDir(i){
  if(dir!=="mix") return dir;
  var lh=isLearned(i,"he"), lr=isLearned(i,"ru");
  if(lh && !lr) return "ru";
  if(lr && !lh) return "he";
  return Math.random()<.5 ? "he" : "ru";
}

function buildDeck(){
  buildChips(); updLearnedLine();
  queue=[];
  for(var k=0;k<W.length;k++){
    if(!isActive(k)) continue;
    var d=cardDir(k);
    if(pool==="new" && isLearned(k,d)){
      if(dir==="mix"){
        var other = d==="he" ? "ru" : "he";
        if(!isLearned(k,other)) d=other; else continue;
      } else continue;
    }
    queue.push({i:k, d:d});
  }
  for(var a=queue.length-1;a>0;a--){
    var j=Math.floor(Math.random()*(a+1)), t=queue[a]; queue[a]=queue[j]; queue[j]=t;
  }
  deckSize=queue.length; known=0; reps=0; flipped=false;
  $("totalCount").textContent = deckSize+" карт · "+(backend ? "💾 "+backend : "⚠ без сохранения");
  doneBox.className="done";
  if(!deckSize){ showDone(true); return; }
  plate.style.display=""; answers.style.display="";
  render();
}

function heTxt(s){ return nikud ? s : stripNikud(s); }

function render(){
  if(!queue.length){ showDone(false); return; }
  var cur=queue[0], w=W[cur.i];
  var sec='<div class="sec">'+secName(cur.i)+'</div>';
  var mark=isLearned(cur.i,cur.d)?'<div class="lrn">✓</div>':"";
  var hint=firstCard?'<div class="hint">нажми — перевернётся</div>':"";
  var html;
  if(!flipped){
    html = cur.d==="he"
      ? sec+mark+'<div class="big-he">'+heTxt(w.h)+'</div>'+hint
      : sec+mark+'<div class="big-ru">'+w.r+'</div>'+hint;
  } else {
    html = cur.d==="he"
      ? sec+mark+'<div class="tr">'+w.t+'</div><div class="ru2">'+w.r+'</div>'
      : sec+mark+'<div class="big-he mid">'+heTxt(w.h)+'</div><div class="tr">'+w.t+'</div>';
  }
  card.innerHTML=html;
  answers.className = flipped ? "answers show" : "answers";
  $("stLeft").textContent=queue.length;
  $("stKnown").textContent=known;
  $("stRep").textContent=reps;
}

function flip(){
  if(!queue.length) return;
  flipped=!flipped; firstCard=false;
  render();
}

function answer(ok){
  if(!flipped||!queue.length) return;
  var cur=queue.shift(), key=pk(cur.i,cur.d);
  if(ok){
    known++;
    prog[key]=(prog[key]||0)+1;
  } else {
    reps++;
    prog[key]=0;
    var pos=Math.min(queue.length, 3+Math.floor(Math.random()*3));
    queue.splice(pos,0,cur);
  }
  saveState();
  updLearnedLine();
  flipped=false;
  render();
}

function showDone(empty){
  plate.style.display="none"; answers.style.display="none";
  $("stLeft").textContent=0; $("stKnown").textContent=known; $("stRep").textContent=reps;
  doneBox.className="done show";
  doneBox.innerHTML = empty
    ? '<div class="he">!הַכֹּל</div><p>В этом режиме всё уже выучено 💪</p><button type="button" id="again">Показать все слова</button>'
    : '<div class="he">!סוֹף</div><p>Пройдено: <b>'+deckSize+'</b> · повторов: <b>'+reps+'</b></p><button type="button" id="again">Ещё раз</button>';
  $("again").addEventListener("click", function(){
    if(empty){
      pool="all";
      var pb=$("poolSeg").querySelectorAll("button");
      pb.forEach(function(x){ x.className = x.getAttribute("data-p")==="all" ? "on" : ""; });
      saveState();
    }
    buildDeck();
  });
}

/* ---------- события ---------- */
card.addEventListener("click", flip);
$("btnNo").addEventListener("click", function(){ answer(false); });
$("btnYes").addEventListener("click", function(){ answer(true); });

var segBtns=$("dirSeg").querySelectorAll("button");
segBtns.forEach(function(b){
  b.addEventListener("click",function(){
    segBtns.forEach(function(x){ x.className=""; });
    b.className="on"; dir=b.getAttribute("data-d");
    saveState(); buildDeck();
  });
});
var poolBtns=$("poolSeg").querySelectorAll("button");
poolBtns.forEach(function(b){
  b.addEventListener("click",function(){
    poolBtns.forEach(function(x){ x.className=""; });
    b.className="on"; pool=b.getAttribute("data-p");
    saveState(); buildDeck();
  });
});
$("nikudTgl").addEventListener("click",function(){
  nikud=!nikud;
  this.className = nikud ? "on" : "";
  this.setAttribute("aria-checked", nikud);
  saveState(); render();
});

var resetArmed=false;
$("resetBtn").addEventListener("click",function(){
  var b=this;
  if(!resetArmed){
    resetArmed=true; b.className="arm"; b.textContent="точно сбросить?";
    setTimeout(function(){ resetArmed=false; b.className=""; b.textContent="сбросить прогресс"; }, 3000);
  } else {
    resetArmed=false; prog={};
    saveState();
    b.className=""; b.textContent="сбросить прогресс";
    buildDeck();
  }
});

document.addEventListener("keydown",function(e){
  if(e.key===" "){ e.preventDefault(); flip(); }
  if(e.key==="ArrowLeft"||e.key==="1") answer(false);
  if(e.key==="ArrowRight"||e.key==="2") answer(true);
});

/* ---------- старт ---------- */
(async function init(){
  if(!W.length){
    card.innerHTML='<div class="ru2">Не найден файл words.js — он должен лежать рядом с index.html</div>';
    return;
  }
  try{ await detectBackend(); }catch(e){}
  var st=null;
  try{ st = await loadState(); }catch(e){}
  if(st){
    if(st.dir) dir=st.dir;
    if(typeof st.nikud==="boolean") nikud=st.nikud;
    if(st.pool) pool=st.pool;
    if(st.activeNames) SECTIONS.forEach(function(n){ if(n in st.activeNames) activeNames[n]=st.activeNames[n]; });
    if(st.prog) prog=st.prog;
    segBtns.forEach(function(x){ x.className = x.getAttribute("data-d")===dir ? "on" : ""; });
    poolBtns.forEach(function(x){ x.className = x.getAttribute("data-p")===pool ? "on" : ""; });
    var t=$("nikudTgl"); t.className = nikud ? "on" : ""; t.setAttribute("aria-checked", nikud);
  }
  buildDeck();
})();
</script>
</body>
</html>
